server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: every route falls back to index.html (expo-router handles it)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_expo/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
